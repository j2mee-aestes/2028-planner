name: 휴대폰 알림 발송

on:
  schedule:
    - cron: '30 22 * * *' # 매일 07:30 KST 아침 알림
    - cron: '0 1 * * 6' # 토요일 10:00 KST 미룬 할 일 알림
  workflow_dispatch:
    inputs:
      mode:
        description: 'morning 또는 saturday'
        required: true
        default: morning

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx esbuild scripts/send-push.ts --bundle --platform=node --format=esm --target=node20 --packages=external --outfile=.push/send.mjs
      - run: node .push/send.mjs "${{ github.event.inputs.mode || (github.event.schedule == '0 1 * * 6' && 'saturday' || 'morning') }}"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
